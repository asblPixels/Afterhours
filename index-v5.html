  SC=Math.min(vw/W,vh/H);
  OX=Math.round((vw-W*SC)/2);
  OY=Math.round((vh-H*SC)/2);
  stage.style.width=W+'px';
  stage.style.height=H+'px';
  stage.style.left=OX+'px';
  stage.style.top=OY+'px';
  stage.style.transform='scale('+SC+')';
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  const f=document.getElementById('fx');
  if(f){ f.width=W*d; f.height=H*d; f.getContext('2d').setTransform(d,0,0,d,0,0); }
}

/* ---------- audio (100% généré, zéro sample) ---------- */
const A={ctx:null,master:null,on:true,playing:false,next:0,step:0};
function aInit(){
  if(A.ctx) return;
  try{
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain(); A.master.gain.value=.45; A.master.connect(A.ctx.destination);
    A.next=A.ctx.currentTime+.1;
    setInterval(sched,25);
  }catch(e){A.ctx=null;}
}
function kick(t){
  if(!A.ctx)return; const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(42,t+.11);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.26);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+.3);
}
function hat(t,v){
  if(!A.ctx)return; const b=A.ctx.createBuffer(1,900,A.ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<900;i++) d[i]=(Math.random()*2-1)*(1-i/900);
  const s=A.ctx.createBufferSource(); s.buffer=b;
  const f=A.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
  const g=A.ctx.createGain(); g.gain.value=v||.13;
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t);
}
function bass(t,f){
  if(!A.ctx)return; const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sawtooth'; o.frequency.value=f;
  const lp=A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
  g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.22,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.connect(lp); lp.connect(g); g.connect(A.master); o.start(t); o.stop(t+.2);
}
function sched(){
  if(!A.ctx) return;
  const spb=60/150/2;
  while(A.next < A.ctx.currentTime+.12){
    if(A.on&&A.playing){
      if(A.step%2===0) kick(A.next);
      hat(A.next+spb/2,.1);
      if(A.step%2===1) bass(A.next,[55,55,73.4,65.4][(A.step>>3)%4]);
    }
    A.next+=spb; A.step=(A.step+1)%32;
  }
}
function sfx(f1,f2,dur,type,vol){
  if(!A.ctx||!A.on)return; const t=A.ctx.currentTime;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur);
  g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+dur+.02);
}
const sHit=()=>sfx(880,1250,.07,'square',.14);
const sMiss=()=>sfx(200,90,.16,'sawtooth',.16);
const sCrash=()=>sfx(150,40,.32,'sawtooth',.3);
const sWin=()=>{sfx(520,1050,.3,'triangle',.25);setTimeout(()=>sfx(780,1400,.35,'triangle',.22),120);};
const sLose=()=>{sfx(330,70,.6,'sawtooth',.28);};
const sWasted=()=>{sfx(220,55,.75,'sawtooth',.32);setTimeout(()=>sfx(140,42,.6,'sine',.28),180);};
document.getElementById('sound').onclick=e=>{
  aInit(); A.on=!A.on; e.target.textContent=A.on?'♪':'✕';
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
};

/* ---------- état global & FX max ---------- */
const G={resp:0,cash:200,mission:0,dj:'DJ PIXEL',scene:'menu',t:0,shake:0,stars:0,callouts:[],sparks:[],flashOverlay:0,flashCol:'#26EFC5'};
const SHOUTS=["COME ON!","JUMP! JUMP!","PUSSY!","HANDS UP!","BASS DROP!","LET'S GO!","HARDSTYLE!","150 BPM!","PUT YOUR HANDS UP!"];
function addShout(txtStr,x,y,col){
  G.callouts.push({t:txtStr,x:x||W/2,y:y||240,vy:-58,life:1.25,max:1.25,col:col||'#26EFC5',rot:(Math.random()-.5)*.24,sc:1.35});
}
function spawnSparks(x,y,col,n,spd){
  for(let i=0;i<(n||18);i++){
    const a=Math.random()*Math.PI*2, v=(spd||220)*(.35+Math.random()*.85);
    G.sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.45+Math.random()*.35,max:.75,col:col||'#26EFC5',sz:2+Math.random()*3.5});
  }
}
function triggerFlash(col,intensity){
  G.flashCol=col||'#26EFC5';
  G.flashOverlay=Math.max(G.flashOverlay,intensity||.28);
}
function updateAndDrawFX(dt){
  for(const s of G.sparks){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=520*dt; s.life-=dt;
    const al=Math.max(0,s.life/s.max);
    ctx.save(); ctx.globalAlpha=al;
    glow(s.col,10,()=>{ctx.fillStyle=s.col; ctx.fillRect(s.x-s.sz/2,s.y-s.sz/2,s.sz,s.sz);});
    ctx.restore();
  }
  G.sparks=G.sparks.filter(s=>s.life>0);
  for(const c of G.callouts){
    c.y+=c.vy*dt; c.life-=dt; c.sc+=(1-c.sc)*Math.min(1,dt*12);
    const a=Math.max(0,Math.min(1,c.life/c.max));
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.scale(c.sc,c.sc);
    ctx.globalAlpha=a;
    glow(c.col,16,()=>{ txt(c.t,0,0,30,c.col); });
    ctx.strokeStyle='#000'; ctx.lineWidth=1.4;
    ctx.font="30px 'Bebas Neue',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeText(c.t,0,0);
    ctx.restore();
  }
  G.callouts=G.callouts.filter(c=>c.life>0);
  if(G.flashOverlay>0){
    ctx.save(); ctx.globalAlpha=G.flashOverlay;
    ctx.fillStyle=G.flashCol; ctx.fillRect(0,0,W,H);
    ctx.restore();
    G.flashOverlay=Math.max(0,G.flashOverlay-dt*1.4);
  }
}

const TQ='#26EFC5', PK='#ff4d6d', OR='#ff8c42', GD='#fbbf24';
function rr(x,y,w,h,r){ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}
function txt(s,x,y,size,col,align,font){
  ctx.fillStyle=col||'#fff'; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.font=(font||("'Bebas Neue',sans-serif"))==='i'
    ? '800 '+size+'px Inter,sans-serif' : size+"px 'Bebas Neue',sans-serif";
  ctx.fillText(s,x,y);}
function glow(col,b,fn){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=b;fn();ctx.restore();}
function bar(x,y,w,h,v,col){
  ctx.fillStyle='rgba(255,255,255,.14)'; rr(x,y,w,h,h/2); ctx.fill();

/* Étoiles de recherche GTA (Wanted Stars) */
function drawStarShape(cx,cy,spikes,outerR,innerR){
  let rot=Math.PI/2*3, x=cx, y=cy, step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outerR);
  for(let i=0;i<spikes;i++){
    x=cx+Math.cos(rot)*outerR; y=cy+Math.sin(rot)*outerR; ctx.lineTo(x,y); rot+=step;
    x=cx+Math.cos(rot)*innerR; y=cy+Math.sin(rot)*innerR; ctx.lineTo(x,y); rot+=step;
  }
  ctx.lineTo(cx,cy-outerR); ctx.closePath();
}
function drawWantedStars(count){
  const startX=W-145, y=38, blink=((G.t*6|0)%2===0);
  for(let i=0;i<5;i++){
    const active=i<count;
    ctx.save();
    drawStarShape(startX+i*18,y,5,8,3.6);
    if(active){
      ctx.fillStyle=blink?GD:'#fff';
      ctx.shadowColor=GD; ctx.shadowBlur=8;
    } else {
      ctx.fillStyle='rgba(255,255,255,.15)';
    }
    ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }
}

/* Guirlande de fanions triangulaires Jumpstyle / Rave */
function drawPennantBanner(y, sag, scroll){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-10,y); ctx.quadraticCurveTo(W/2,y+sag,W+10,y); ctx.stroke();
  const cols=[TQ,PK,GD,'#a855f7'];
  const count=12;
  for(let i=0;i<=count;i++){
    const u=i/count;
    const bx=-10+u*(W+20);
    const by=y + 4*sag*u*(1-u);
    const flutter=Math.sin(G.t*7+i+scroll)*3;
    const col=cols[i%cols.length];
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(bx-14,by); ctx.lineTo(bx+14,by); ctx.lineTo(bx+flutter,by+26);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#05070b'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

function drawPalm(x,y,sc,flip){
  ctx.save(); ctx.translate(x,y); ctx.scale(flip?-sc:sc,sc);
  ctx.strokeStyle='#0d1216'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(8,-35,3,-72); ctx.stroke();
  ctx.fillStyle='#081c1a';
  for(let a=-2.4;a<=0.7;a+=0.62){
    ctx.save(); ctx.translate(3,-72); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(18,-10,36,6); ctx.quadraticCurveTo(18,-2,0,3); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawCitySkyline(scroll,baseY,hScale){
  const blds=[
    {w:68,h:240,c:'#0b0f17'},{w:52,h:180,c:'#0d131d'},{w:84,h:290,c:'#090d14'},
    {w:60,h:210,c:'#0e1420'},{w:74,h:265,c:'#0a0e16'},{w:56,h:165,c:'#0c121b'},
    {w:78,h:250,c:'#090c13'},{w:64,h:195,c:'#0d131e'}
  ];
  const totalW=blds.reduce((a,b)=>a+b.w+6,0);
  for(let pass=-1;pass<=1;pass++){
    let cx=pass*totalW - (scroll%totalW);
    for(let i=0;i<blds.length;i++){
      const b=blds[i], bh=b.h*hScale, bx=cx, by=baseY-bh;
      ctx.fillStyle=b.c; ctx.fillRect(bx,by,b.w,bh);
      ctx.fillStyle=(i%2===0)?'rgba(38,239,197,.28)':'rgba(255,77,109,.28)';
      ctx.fillRect(bx,by,b.w,2);
      ctx.fillStyle=(i%3===0)?'rgba(38,239,197,.22)':'rgba(255,190,120,.18)';
      for(let wy=by+14;wy<baseY-16;wy+=16){
        for(let wx=bx+8;wx<bx+b.w-10;wx+=12){
          if(((wx*13+wy*7+i)%5)!==0) ctx.fillRect(wx,wy,6,8);
        }
      }
      cx+=b.w+6;
    }
  }
}

/* Mini-radar HUD façon GTA en bas à gauche */
function drawRadar(mode, data){
  const rx=54, ry=H-56, rr0=36;
  ctx.save();
  ctx.beginPath(); ctx.arc(rx,ry,rr0,0,Math.PI*2);
  ctx.fillStyle='rgba(7,12,18,.86)'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2;
  const off=(G.t*18)%18;
  for(let g=-36;g<=36;g+=18){
    ctx.beginPath(); ctx.moveTo(rx-40,ry+g+off); ctx.lineTo(rx+40,ry+g+off); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx+g,ry-40); ctx.lineTo(rx+g,ry+40); ctx.stroke();
  }
  ctx.fillStyle='rgba(38,239,197,.15)'; ctx.fillRect(rx-7,ry-40,14,80);
  if(mode==='m1'){
    const dy=Math.max(-28, -28*(1-data.prog/100));
    ctx.fillStyle=TQ; ctx.fillRect(rx-4,ry+dy-4,8,8);
    if(data.boost){
      const py=Math.min(28, data.copGap/10);
      ctx.fillStyle=((G.t*8|0)%2)?'#3b82f6':PK;
      ctx.beginPath(); ctx.arc(rx+((data.cop-data.x)/8),ry+py,4,0,7); ctx.fill();
    }
  } else if(mode==='m3'){
    const bx=Math.max(-28, -data.gap/8);
    ctx.fillStyle=PK; ctx.beginPath(); ctx.arc(rx+bx,ry,4,0,7); ctx.fill();
    const vx=Math.min(28, (100-data.dist)/3.2);
    ctx.fillStyle=TQ; ctx.fillRect(rx+vx-4,ry-4,8,8);
  } else if(mode==='m4'){
    const tx=(data.tx-data.x)/6;
    ctx.fillStyle=TQ; ctx.fillRect(rx+Math.max(-26,Math.min(26,tx))-4,ry-4,8,8);
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(rx,ry-5); ctx.lineTo(rx+4,ry+4); ctx.lineTo(rx,ry+2); ctx.lineTo(rx-4,ry+4); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(rx,ry,rr0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=data.alert?PK:TQ; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(rx,ry,rr0,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,Math.min(1,data.ratio))); ctx.stroke();
  ctx.fillStyle='#05070b'; ctx.beginPath(); ctx.arc(rx,ry-rr0,7,0,7); ctx.fill();
  txt('N',rx,ry-rr0+.5,10,'#fff','center','i');
  ctx.restore();
}

function drawSmiley(g,x,y,r,rot){
  g.save(); g.translate(x,y); if(rot)g.rotate(rot);
  g.lineJoin='round'; g.lineCap='round';
  g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(3,r*.26);
  g.beginPath(); g.arc(0,-.06*r,r*1.04,Math.PI*1.06,Math.PI*1.94); g.stroke();
  g.strokeStyle='#b9cccd'; g.lineWidth=Math.max(1.5,r*.13);
  g.beginPath(); g.arc(0,-.06*r,r*1.04,Math.PI*1.06,Math.PI*1.94); g.stroke();
  g.fillStyle='#2b3539'; g.strokeStyle='#b9cccd'; g.lineWidth=Math.max(1.2,r*.08);
  g.beginPath(); g.ellipse(-r*1.04,-.02*r,r*.21,r*.32,0,0,7); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(r*1.04,-.02*r,r*.21,r*.32,0,0,7); g.fill(); g.stroke();
  g.fillStyle='#26EFC5'; g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(1.6,r*.14);
  g.beginPath(); g.arc(0,0,r,0,7); g.fill(); g.stroke();
  g.fillStyle='#0b0b0b';
  const e=r*.2;
  g.fillRect(-.52*r,-.42*r,e,e); g.fillRect(-.52*r+e,-.42*r+e,e,e);
  g.fillRect(.32*r,-.42*r,e,e);  g.fillRect(.32*r+e,-.42*r+e,e,e);
  g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(1.8,r*.15);
  g.beginPath(); g.arc(0,.04*r,r*.56,.34,Math.PI-.34); g.stroke();
  g.restore();
}

/* --- M1 : autoroute côtière nocturne + nitro FX --- */
const LANES=[96,192,288,384];
const CAR_COLS=['#3b4754','#632b38','#274945','#5c4a2e','#2f3640'];
function m1(dt){
  const sp=S.boost?445:340;
  S.road+=sp*dt;
  S.prog+=dt*(100/(S.boost?22:26));
  S.time-=dt;
  if(P.down) S.x+=(P.x-S.x)*Math.min(1,dt*9);
  if(keys.ArrowLeft) S.x-=300*dt;
  if(keys.ArrowRight) S.x+=300*dt;
  S.x=Math.max(72,Math.min(W-72,S.x));
  if(!S.boost&&S.prog>42){
    S.boost=true; S.evt=3; S.cop=S.x; G.stars=5;
    triggerFlash('#ff4d6d',.42);
    spawnSparks(S.x,730,'#26EFC5',28,260);
    addShout('5 STARS! FLOOR IT!',W/2,320,PK);
    sfx(400,900,.4,'triangle',.2);
  }
  // Flammes d'échappement & traînée nitro
  if(Math.random()<dt*(S.boost?55:24)){
    S.exhaust.push({x:S.x+(Math.random()-.5)*16,y:732,vy:140+Math.random()*120,life:.26,col:S.boost?TQ:OR});
  }
  for(const e of S.exhaust){ e.y+=e.vy*dt; e.life-=dt; }
  S.exhaust=S.exhaust.filter(e=>e.life>0);

  S.spawn-=dt;
  if(S.spawn<=0){
    S.spawn=S.boost?.52:.72;
    const l=LANES[(Math.random()*4)|0];
    S.cars.push({x:l,y:-80,v:sp*(.35+Math.random()*.2),t:Math.random()<.22?'cone':'car',col:CAR_COLS[(Math.random()*5)|0]});
  }
  for(const c of S.cars) c.y+=(sp-c.v)*dt;
  S.cars=S.cars.filter(c=>c.y<H+90);
  S.hitT-=dt;
  if(S.hitT<=0) for(const c of S.cars){
    const w=c.t==='cone'?26:54,h=c.t==='cone'?26:86;
    if(Math.abs(c.x-S.x)<(w/2+26)&&Math.abs(c.y-690)<(h/2+42)){
      S.hitT=.7; G.shake=18; S.copGap-=70; S.time-=1.5; G.stars=Math.min(5,G.stars+1);
      triggerFlash('#ff2a4b',.45);
      spawnSparks(S.x,660,'#fbbf24',30,300);
      addShout('AH SHIT!',S.x,620,PK);
      sCrash(); break;}
  }
  if(S.boost){
    S.cop+=(S.x-S.cop)*Math.min(1,dt*2.2);
    S.copGap=Math.min(300,S.copGap+22*dt);
    if(S.copGap<=0){ result(false,t('fcop'),t('rcop'),-3,-60); return;}
  }
  if(S.prog>=100){
    const bonus=Math.max(0,Math.round(S.time/6));
    result(true,t('win'),t('w1').replace('{r}',5+bonus),5+bonus,150); return;
  }
  if(S.time<=0){ result(false,t('ftime'),t('rtime'),-3,0); return;}
  // ---- rendu ----
  ctx.fillStyle='#061018'; ctx.fillRect(0,0,56,H);
  ctx.fillStyle='#0d1218'; ctx.fillRect(W-56,0,56,H);
  ctx.fillStyle='rgba(38,239,197,.08)';
  for(let i=0;i<14;i++){ const wy=(i*68+S.road*.4)%H; ctx.fillRect(8+(i%3)*12,wy,18,3); }
  ctx.fillStyle='#1b222b'; ctx.fillRect(46,0,10,H); ctx.fillRect(W-56,0,10,H);
  ctx.fillStyle='#13171d'; ctx.fillRect(56,0,W-112,H);
  ctx.fillStyle='rgba(255,255,255,.025)';
  for(let i=0;i<45;i++){ const gx=66+((i*97)%348), gy=((i*131+S.road)%H); ctx.fillRect(gx,gy,3,6); }
  // Speed-lines sur les côtés en mode 5 étoiles
  if(S.boost){
    ctx.strokeStyle='rgba(38,239,197,.28)'; ctx.lineWidth=2;
    for(let i=0;i<10;i++){
      const sy=((i*95+S.road*1.8)%H);
      ctx.beginPath(); ctx.moveTo(62,sy); ctx.lineTo(62,sy+45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-62,sy+20); ctx.lineTo(W-62,sy+65); ctx.stroke();
    }
  }
  ctx.strokeStyle='rgba(255,77,109,.55)'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(56,0);ctx.lineTo(56,H);ctx.stroke();
  ctx.strokeStyle='rgba(38,239,197,.55)';
  ctx.beginPath();ctx.moveTo(W-56,0);ctx.lineTo(W-56,H);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=4; ctx.setLineDash([42,38]);
  ctx.lineDashOffset=-S.road%80;
  for(const lx of [144,240,336]){ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);
  for(let i=0;i<5;i++){
    const ly=((i*210+S.road)%(H+210))-105;
    const lg=ctx.createRadialGradient(54,ly,2,54,ly,65);
    lg.addColorStop(0,'rgba(255,210,130,.22)'); lg.addColorStop(1,'rgba(255,210,130,0)');
    ctx.fillStyle=lg; ctx.fillRect(0,ly-65,120,130);
    ctx.fillStyle='#4a5560'; ctx.fillRect(42,ly-2,18,4);
    drawPalm(W-24,ly+40,.65,true);
  }
  for(const c of S.cars){
    if(c.t==='cone'){
      ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(c.x+3,c.y+4,14,0,7); ctx.fill();
      ctx.fillStyle=OR; ctx.beginPath(); ctx.moveTo(c.x,c.y-15);
      ctx.lineTo(c.x+13,c.y+13); ctx.lineTo(c.x-13,c.y+13); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillRect(c.x-7,c.y,14,4);
    } else {
      ctx.fillStyle='rgba(0,0,0,.45)'; rr(c.x-25,c.y-39,54,86,10); ctx.fill();
      ctx.fillStyle=c.col; rr(c.x-27,c.y-43,54,86,10); ctx.fill();

/* --- M2 : club underground + FX pyrotechniques & equalizer --- */
function m2(dt){
  S.time-=dt;
  S.hype-=1.8*dt;
  S.spawn-=dt;
  if(S.spawn<=0){
    S.spawn=.34+Math.random()*.16;
    const l=(Math.random()*4)|0;
    S.notes.push({l:l,y:-30});
    if(Math.random()<.18){let l2=(l+1+((Math.random()*3)|0))%4; S.notes.push({l:l2,y:-30});}
  }
  if(Math.random()<dt*2.8){
    S.flashes.push({x:25+Math.random()*(W-50),y:450+Math.random()*55,t:.22});
  }
  for(const fl of S.flashes) fl.t-=dt;
  S.flashes=S.flashes.filter(fl=>fl.t>0);

  const JY=716;
  for(const n of S.notes) n.y+=430*dt;
  for(const n of S.notes) if(!n.hit&&n.y>JY+46){n.hit='late'; S.hype-=5; S.combo=0; sMiss(); G.shake=7; triggerFlash('#ff4d6d',.18);}
  S.notes=S.notes.filter(n=>n.y<H+40);
  const lanesX=[60,165,270,375], lw=105;
  function judge(l){
    let best=null,bd=1e9;
    for(const n of S.notes){ if(n.hit||n.l!==l)continue; const d=Math.abs(n.y-JY);
      if(d<bd){bd=d;best=n;} }
    if(best&&bd<62){
      best.hit='ok'; S.hype=Math.min(100,S.hype+4.2); S.combo++; sHit();
      const hitX=lanesX[l]+lw/2;
      S.fx.push({x:hitX,y:JY,t:0});
      spawnSparks(hitX,JY,l%2?PK:TQ,14,200);
      triggerFlash(l%2?PK:TQ,.12);
      if(S.combo%5===0){
        const sh=SHOUTS[(Math.random()*SHOUTS.length)|0];
        addShout(sh, hitX, JY-75, (S.combo%10===0)?GD:TQ);
        spawnSparks(W/2,310,GD,24,260);
      }
    } else { S.hype-=2.6; S.combo=0; sMiss(); }
  }
  if(P.tapped){ const l=Math.max(0,Math.min(3,Math.floor(P.tapX/120))); judge(l); }
  ['a','z','e','r'].forEach((k,i)=>{ if(keys[k]){keys[k]=false; judge(i);} });
  for(const f of S.fx) f.t+=dt; S.fx=S.fx.filter(f=>f.t<.38);
  S.hype=Math.min(100,S.hype);
  if(S.hype<=0){ result(false,t('fdead'),t('rdead'),-3,0); return;}
  if(S.time>3&&S.time<=S.next&&S.drunk===0){ S.drunk=1; drunkEvent(); return; }
  if(S.time<=0){
    const b=S.hype>80?4:S.hype>55?2:0;
    result(true,t('wset'),t('rset').replace('{r}',5+b),5+b,120); return;}
  // ---- rendu ----
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1b0826'); g.addColorStop(.55,'#0c121c'); g.addColorStop(1,'#06080a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Spectre equalizer géant en arrière-plan réactif au BPM
  const beat=Math.pow(Math.max(0,Math.sin(G.t*15.7)),4);
  for(let b=0;b<16;b++){
    const bh=35 + Math.abs(Math.sin(G.t*9+b*.7))*140*(.5+beat*.8);
    ctx.fillStyle=b%2?'rgba(38,239,197,.08)':'rgba(255,77,109,.08)';
    ctx.fillRect(46+b*24, 460-bh, 18, bh);
  }
  ctx.fillStyle='#090c12'; ctx.fillRect(0,115,44,445); ctx.fillRect(W-44,115,44,445);
  for(const sx of [6,W-38]){
    ctx.fillStyle='#141923'; ctx.fillRect(sx,230,32,210);
    for(let sy=255;sy<=405;sy+=50){
      ctx.fillStyle='#080a0f'; ctx.beginPath(); ctx.arc(sx+16,sy,13+beat*3.5,0,7); ctx.fill();
      ctx.strokeStyle=TQ; ctx.lineWidth=1.5; ctx.stroke();
    }
  }
  ctx.fillStyle='#151b24'; ctx.fillRect(36,125,W-72,10);
  drawPennantBanner(134, 28, 0);
  drawPennantBanner(215, 22, 2);

  glow(PK,14,()=>{ctx.strokeStyle=PK; ctx.lineWidth=2; ctx.strokeRect(W/2-115,270,230,34);});
  txt('JUMPER STAGE · 150 BPM',W/2,288,18,GD);
  if(S.combo>=3) txt('COMBO x'+S.combo,W/2,324,20,TQ);

  const pulse=.5+.5*Math.sin(G.t*8);
  for(let i=0;i<5;i++){
    const lx=75+i*82, sway=Math.sin(G.t*1.8+i)*75;
    ctx.fillStyle=i%2===0?'rgba(38,239,197,'+(.14+.10*pulse)+')':'rgba(255,77,109,'+(.12+.09*pulse)+')';
    ctx.beginPath(); ctx.moveTo(lx,135); ctx.lineTo(lx-60+sway,540); ctx.lineTo(lx+60+sway,540); ctx.fill();
  }
  ctx.fillStyle='#05070a';
  for(let i=0;i<18;i++){ const x=10+i*27, bob=Math.sin(G.t*6+i)*7;
    ctx.beginPath(); ctx.arc(x,472+bob,12,0,7); ctx.fill();
    ctx.fillRect(x-11,482+bob,22,78);
    if((i+((G.t*2)|0))%5===0){
      ctx.fillStyle=i%2?TQ:PK; ctx.fillRect(x+6,454+bob,5,7); ctx.fillStyle='#05070a';
    }
  }
  for(const fl of S.flashes){
    const al=fl.t/.22;
    const fg=ctx.createRadialGradient(fl.x,fl.y,1,fl.x,fl.y,26);
    fg.addColorStop(0,'rgba(255,255,255,'+al+')');
    fg.addColorStop(.4,'rgba(38,239,197,'+(al*.4)+')');
    fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fl.x,fl.y,26,0,7); ctx.fill();
  }
  for(let i=0;i<4;i++){
    ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(255,255,255,.018)';
    ctx.fillRect(i*120,560,120,H-560);
    ctx.strokeStyle='rgba(38,239,197,.12)'; ctx.lineWidth=1;
    ctx.strokeRect(i*120,560,120,H-560);
  }
  ctx.strokeStyle='rgba(38,239,197,.9)'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,JY);ctx.lineTo(W,JY);ctx.stroke();
  for(const n of S.notes){ if(n.hit||n.y<118)continue;
    glow(TQ,14,()=>{ctx.fillStyle=TQ; rr(n.l*120+16,n.y-13,88,26,8); ctx.fill();}); }
  for(const f of S.fx){
    const prog=f.t/.38;
    ctx.strokeStyle='rgba(38,239,197,'+(1-prog)+')'; ctx.lineWidth=5*(1-prog)+1;
    ctx.beginPath(); ctx.arc(f.x,f.y,12+prog*130,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(255,77,109,'+(1-prog)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(f.x,f.y,6+prog*85,0,7); ctx.stroke();
  }
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,760,W,94);
  ctx.fillStyle=PK; ctx.fillRect(0,760,W,2);
  for(const cx of [92,388]){ ctx.fillStyle='#1b2227'; ctx.beginPath(); ctx.arc(cx,812,38,0,7); ctx.fill();
    ctx.strokeStyle='rgba(38,239,197,.65)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(cx,812,38,G.t*5,G.t*5+2.2); ctx.stroke();
    ctx.fillStyle=TQ; ctx.beginPath(); ctx.arc(cx,812,6,0,7); ctx.fill(); }
  const bob=Math.sin(G.t*6.3)*4;
  ctx.fillStyle='#161d22'; rr(W/2-44,812+bob,88,46,14); ctx.fill();
  drawSmiley(ctx,W/2,790+bob,29+beat*2,Math.sin(G.t*3.1)*.09);
  txt(t('pads'),W/2,744,14,'rgba(255,255,255,.35)');
  updateAndDrawFX(dt);
  hud();
  txt(t('hype'),14,62,13,'#8ea3a4','left','i');
  bar(62,58,W-78,12,S.hype/100,S.hype>35?TQ:PK);
  bar(14,84,W-28,6,1-S.time/52,'rgba(255,255,255,.45)');
  txt(t('sets')+'  '+Math.max(0,S.time|0)+'s',W/2,106,16,'#9fb0b1');
}
function drunkEvent(){
  A.playing=false; G.scene='choice';
  const list=$('ch-list'); list.innerHTML='';
  const opts=[
    {t:t('o1t'),s:t('o1s'),f:()=>{
      S.ignored++;
      if(S.ignored>=3){ result(false,t('fban'),t('rban'),-4,0); return true;}
      S.hype=Math.min(100,S.hype+3); G.resp+=1; return false;}},
    {t:t('o2t'),s:t('o2s'),f:()=>{
      G.cash=Math.max(0,G.cash-5); G.resp+=2; S.hype=Math.min(100,S.hype+8); S.ignored=0; return false;}},
    {t:t('o3t'),s:t('o3s'),f:()=>{
      S.hype=Math.max(1,S.hype-16); G.resp=Math.max(0,G.resp-2); S.ignored=0; return false;}}
  ];
  const labels=[t('d1'),t('d2'),t('d3')];
  $('ch-t').textContent=labels[Math.min(2,S.evts)]; S.evts++;
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=o.t+'<small>'+o.s+'</small>';
    b.onclick=()=>{ show(null); const over=o.f();
      if(over) return;
      S.drunk=0; S.next=(S.evts>=3)?-1:S.time-13; A.playing=true; G.scene='play'; P.tapped=false; };
    list.appendChild(b);
  });
  show('choice');
}

/* --- M3 : ruelle arrière du club (crépuscule GTA + fanions + étincelles) --- */
function m3(dt){
  const sp=240+S.dist*1.1;
  S.dist+=dt*(100/16);
  S.run+=dt;
  const jump=(P.tapped&&P.tapX>W/2)||keys.ArrowUp||keys[' '];
  const slide=(P.tapped&&P.tapX<=W/2)||keys.ArrowDown;
  if(jump&&S.y===0&&S.slide<=0){
    S.vy=-620; spawnSparks(140,636,TQ,14,180); addShout('JUMP!',140,510,TQ); sfx(300,620,.12,'triangle',.16);
  }
  if(slide&&S.y===0&&S.slide<=0){
    S.slide=.55; spawnSparks(140,636,GD,16,200); addShout('SLIDE!',140,580,GD); sfx(500,160,.16,'sawtooth',.14);
  }
  if(S.slide>0){
    S.slide-=dt;
    if(Math.random()<dt*40) spawnSparks(125,638,TQ,1,120);
  }
  S.vy+=1900*dt; S.y+=S.vy*dt;
  if(S.y>0){S.y=0;S.vy=0;}
  S.spawn-=dt;
  if(S.spawn<=0){ S.spawn=.95+Math.random()*.65;
    S.obs.push({x:W+60,t:Math.random()<.45?'low':'high'}); }
  for(const o of S.obs) o.x-=sp*dt;
  S.obs=S.obs.filter(o=>o.x>-90);
  const PX=140, GY=640;
  S.stumble-=dt;
  if(S.stumble<=0) for(const o of S.obs){
    if(Math.abs(o.x-PX)<34){
      const h=S.y, sl=S.slide>0;
      const safe = o.t==='high' ? (h<-60) : sl;
      if(!safe){
        S.stumble=.6; S.gap-=72; G.shake=16; G.stars=5;
        triggerFlash('#ff2a4b',.4);
        spawnSparks(PX,GY-40,PK,26,260);

    ctx.fillStyle='#0d1118'; ctx.fillRect(bx,by,136,bh);

    ctx.fillStyle='rgba(255,180,100,.12)';

/* --- M4 : parachute sur la mainstage avec fumigènes & pyrotechnie --- */
function m4(dt){
  S.alt-=115*dt;
  S.wt-=dt;
  if(S.wt<=0){
    S.wt=1.6+Math.random()*1.2; S.wind=(Math.random()*2-1)*105;
    if(Math.abs(S.wind)>65) addShout(S.wind>0?'WIND RIGHT!':'WIND LEFT!',W/2,210,OR);
  }
  S.x+=S.wind*dt;
  if(P.down) S.x+=Math.max(-190,Math.min(190,(P.x-S.x)*4))*dt;
  if(keys.ArrowLeft) S.x-=185*dt;
  if(keys.ArrowRight) S.x+=185*dt;
  S.x=Math.max(20,Math.min(W-20,S.x));
  S.tx=W/2+Math.sin(G.t*.8)*78;
  const py=288+(1-S.alt/1200)*150;
  // Fumigènes colorés aux chevilles du parachutiste
  if(Math.random()<dt*42){
    S.trail.push({x:S.x+(Math.random()-.5)*10,y:py+28,vx:(Math.random()-.5)*25-S.wind*.2,vy:-95,life:.55,col:Math.random()<.5?TQ:PK});
  }
  for(const tr of S.trail){ tr.x+=tr.vx*dt; tr.y+=tr.vy*dt; tr.life-=dt; }
  S.trail=S.trail.filter(tr=>tr.life>0);

  if(S.alt<=0){
    const d=Math.abs(S.x-S.tx);
    if(d<30){ result(true,t('wper'),t('rper'),9,400); return;}
    if(d<98){ result(true,t('wsta'),t('rsta'),6,300); return;}
    result(false,t('foff'),t('roff'),-3,-50); return;
  }
  // ---- rendu ----
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#051124'); g.addColorStop(.55,'#151030'); g.addColorStop(1,'#29112b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Lignes de vent horizontales dans le ciel
  if(Math.abs(S.wind)>25){
    ctx.strokeStyle='rgba(255,140,66,.25)'; ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const wy=160+i*62, wx=((G.t*S.wind*2.8+i*90)%(W+120)+W+120)%(W+120)-60;
      ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(wx+(S.wind>0?55:-55),wy); ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<7;i++){ const cy=((i*165+(1200-S.alt)*2.4)%(H+240))-120;
    ctx.beginPath(); ctx.ellipse((i*97)%W,cy,85,24,0,0,7); ctx.fill(); }
  const k=Math.max(0,1-S.alt/1200), groundY=H-75-k*130;
  ctx.fillStyle='#090d12'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='rgba(38,239,197,.15)'; ctx.fillRect(0,groundY,W,3);
  for(let i=0;i<95;i++){
    const px=(i*41)%W, py=groundY+28+((i*53)%105)*(.3+k*.7);
    ctx.fillStyle=(i%4===0)?'rgba(38,239,197,.22)':(i%7===0)?'rgba(255,77,109,.22)':'rgba(255,255,255,.12)';
    ctx.fillRect(px,py,3+k*3,3+k*3);
  }
  const tw=54+k*54, sh=38+k*44;
  ctx.fillStyle='rgba(38,239,197,.08)';
  ctx.beginPath(); ctx.moveTo(S.tx-tw,groundY+8); ctx.lineTo(S.tx-tw-60,0); ctx.lineTo(S.tx-tw+20,0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(S.tx+tw,groundY+8); ctx.lineTo(S.tx+tw-20,0); ctx.lineTo(S.tx+tw+60,0); ctx.fill();
  glow(TQ,26,()=>{ ctx.fillStyle='rgba(38,239,197,.22)';
    ctx.fillRect(S.tx-tw,groundY+8,tw*2,sh); });
  ctx.strokeStyle=TQ; ctx.lineWidth=3;
  ctx.strokeRect(S.tx-tw,groundY+8,tw*2,sh);
  ctx.fillStyle=PK;
  ctx.fillRect(S.tx-tw-8,groundY+12,6,sh-6);
  ctx.fillRect(S.tx+tw+2,groundY+12,6,sh-6);
  const banH=34+k*28;
  ctx.fillStyle=PK; ctx.fillRect(S.tx-tw-26,groundY+14,14,banH);
  ctx.fillStyle=TQ; ctx.fillRect(S.tx+tw+12,groundY+14,14,banH);

  txt('MAINSTAGE',S.tx,groundY+10+sh/2,16+k*10,TQ);
  ctx.strokeStyle='rgba(38,239,197,.35)'; ctx.lineWidth=1.5; ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(S.tx,groundY+8);ctx.lineTo(S.tx,0);ctx.stroke();
  ctx.setLineDash([]);
  // Fumigènes derrière le parachutiste
  for(const tr of S.trail){
    ctx.save(); ctx.globalAlpha=(tr.life/.55)*.6;
    ctx.fillStyle=tr.col; ctx.beginPath(); ctx.arc(tr.x,tr.y,10*(1-tr.life/.55)+4,0,7); ctx.fill();
    ctx.restore();
  }
  const trailX=S.x - S.wind*.35;
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(S.x,py+18); ctx.lineTo(trailX,py-78); ctx.stroke();
  ctx.save(); ctx.translate(trailX,py-88); ctx.rotate(Math.sin(G.t*5)*.08);
  ctx.fillStyle=PK; rr(-44,-11,88,22,4); ctx.fill();
  txt('COME ON!',0,1,14,'#fff');
  ctx.restore();

  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2;
  for(const o of [-34,-12,12,34]){ ctx.beginPath(); ctx.moveTo(S.x,py); ctx.lineTo(S.x+o,py-46); ctx.stroke(); }
  glow(TQ,18,()=>{ ctx.fillStyle=TQ; ctx.beginPath();
    ctx.ellipse(S.x,py-48,48,26,0,Math.PI,0); ctx.fill(); });
  ctx.fillStyle=PK; ctx.fillRect(S.x-12,py-72,24,6);
  ctx.fillStyle='#fff'; rr(S.x-7,py+8,14,22,5); ctx.fill();
  drawSmiley(ctx,S.x,py+4,13,Math.sin(G.t*2)*.12);
  updateAndDrawFX(dt);
  hud();
  txt(t('alt'),14,62,13,'#8ea3a4','left','i');
  txt(Math.max(0,S.alt|0)+' m',W-16,64,22,'#fff','right');
  bar(14,82,W-28,8,S.alt/1200,TQ);
  drawRadar('m4',{tx:S.tx,x:S.x,ratio:S.alt/1200,alert:S.alt<250});
  if(Math.abs(S.wind)>30){
    txt((S.wind>0?t('windr'):t('windl')),W/2,122,26,OR);
  }
  const dx=S.x-S.tx;
  txt(Math.abs(dx|0)+' '+(dx>0?t('offr'):t('offl')),W/2,152,16,'#9fb0b1');
}

/* ---------- boucle ---------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  ctx.save();
  if(G.shake>0){ G.shake-=dt*45;
    ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake); }
  if(G.scene==='play'){
    if(S.k===0) m1(dt); else if(S.k===1) m2(dt); else if(S.k===2) m3(dt); else m4(dt);
  } else if(G.scene!=='banner') {
    const sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,'#060913'); sg.addColorStop(.65,'#140c24'); sg.addColorStop(1,'#07090b');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    const hg=ctx.createRadialGradient(W/2,H-180,20,W/2,H-180,320);
    hg.addColorStop(0,'rgba(255,77,109,.18)'); hg.addColorStop(.5,'rgba(38,239,197,.08)'); hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg; ctx.fillRect(0,H-500,W,500);
    drawCitySkyline(G.t*14,H-90,1);
    drawPennantBanner(72, 24, 0);
    drawPalm(42,H-90,1.15,false);
    drawPalm(W-42,H-90,1.15,true);
    ctx.fillStyle='#06080c'; ctx.fillRect(0,H-90,W,90);
    ctx.fillStyle='rgba(38,239,197,.35)'; ctx.fillRect(0,H-90,W,2);
  }
  ctx.restore();
  if(raining){ fx.clearRect(0,0,W,H);
    for(const p of rain){ p.y+=p.v*dt; p.a+=p.s*dt;
      if(p.y>H+70){ p.y=-70; p.x=Math.random()*W; }
      if(p.y>-70) drawSmiley(fx,p.x,p.y,p.r,p.a); } }
  P.tapped=false;
  requestAnimationFrame(loop);
}
document.querySelectorAll('#langs button').forEach(b=>{
  b.onclick=()=>{ lang=b.dataset.l; applyLang(); }; });
applyLang();
try{ const lg=document.getElementById('logo').getContext('2d');
  lg.scale(2,2); drawSmiley(lg,60,62,48,0); }catch(e){}
show('menu');
requestAnimationFrame(loop);
</script>
