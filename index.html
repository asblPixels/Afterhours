<script>
'use strict';
const W=480,H=854;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let SC=1,OX=0,OY=0;
function fit(){
  const vw=innerWidth,vh=innerHeight;
  SC=Math.min(vw/W,vh/H);
  OX=(vw-W*SC)/2; OY=(vh-H*SC)/2;
  stage.style.transform='translate('+OX+'px,'+OY+'px) scale('+SC+')';
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  const f=document.getElementById('fx');
  if(f){ f.width=W*d; f.height=H*d; f.getContext('2d').setTransform(d,0,0,d,0,0); }
}
addEventListener('resize',fit); fit();

/* ---------- audio (100% généré, zéro sample) ---------- */
const A={ctx:null,master:null,on:true,playing:false,next:0,step:0};
function aInit(){
  if(A.ctx) return;
  try{
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain(); A.master.gain.value=.45; A.master.connect(A.ctx.destination);
    A.next=A.ctx.currentTime+.1;
    setInterval(sched,25);
  }catch(e){A.ctx=null;}
}
function kick(t){
  if(!A.ctx)return; const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(42,t+.11);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.26);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+.3);
}
function hat(t,v){
  if(!A.ctx)return; const b=A.ctx.createBuffer(1,900,A.ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<900;i++) d[i]=(Math.random()*2-1)*(1-i/900);
  const s=A.ctx.createBufferSource(); s.buffer=b;
  const f=A.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
  const g=A.ctx.createGain(); g.gain.value=v||.13;
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t);
}
function bass(t,f){
  if(!A.ctx)return; const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sawtooth'; o.frequency.value=f;
  const lp=A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
  g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.22,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.connect(lp); lp.connect(g); g.connect(A.master); o.start(t); o.stop(t+.2);
}
function sched(){
  if(!A.ctx) return;
  const spb=60/150/2; // 150 BPM, croches
  while(A.next < A.ctx.currentTime+.12){
    if(A.on&&A.playing){
      if(A.step%2===0) kick(A.next);
      hat(A.next+spb/2,.1);
      if(A.step%2===1) bass(A.next,[55,55,73.4,65.4][(A.step>>3)%4]);
    }
    A.next+=spb; A.step=(A.step+1)%32;
  }
}
function sfx(f1,f2,dur,type,vol){
  if(!A.ctx||!A.on)return; const t=A.ctx.currentTime;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur);
  g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+dur+.02);
}

function rr(x,y,w,h,r){ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}
function txt(s,x,y,size,col,align,font){
  ctx.fillStyle=col||'#fff'; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.font=(font||("'Bebas Neue',sans-serif"))==='i'
    ? '800 '+size+'px Inter,sans-serif' : size+"px 'Bebas Neue',sans-serif";
  ctx.fillText(s,x,y);}
function glow(col,b,fn){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=b;fn();ctx.restore();}
function bar(x,y,w,h,v,col){
  ctx.fillStyle='rgba(255,255,255,.12)'; rr(x,y,w,h,h/2); ctx.fill();
  ctx.fillStyle=col; rr(x,y,Math.max(0,Math.min(1,v))*w,h,h/2); ctx.fill();}
function drawSmiley(g,x,y,r,rot){
  g.save(); g.translate(x,y); if(rot)g.rotate(rot);
  g.lineJoin='round'; g.lineCap='round';
  // casque
  g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(3,r*.26);
  g.beginPath(); g.arc(0,-.06*r,r*1.04,Math.PI*1.06,Math.PI*1.94); g.stroke();
  g.strokeStyle='#b9cccd'; g.lineWidth=Math.max(1.5,r*.13);
  g.beginPath(); g.arc(0,-.06*r,r*1.04,Math.PI*1.06,Math.PI*1.94); g.stroke();
  g.fillStyle='#2b3539'; g.strokeStyle='#b9cccd'; g.lineWidth=Math.max(1.2,r*.08);
  g.beginPath(); g.ellipse(-r*1.04,-.02*r,r*.21,r*.32,0,0,7); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(r*1.04,-.02*r,r*.21,r*.32,0,0,7); g.fill(); g.stroke();
  // visage
  g.fillStyle='#26EFC5'; g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(1.6,r*.14);
  g.beginPath(); g.arc(0,0,r,0,7); g.fill(); g.stroke();
  // yeux pixels
  g.fillStyle='#0b0b0b';
  const e=r*.2;
  g.fillRect(-.52*r,-.42*r,e,e); g.fillRect(-.52*r+e,-.42*r+e,e,e);
  g.fillRect(.32*r,-.42*r,e,e);  g.fillRect(.32*r+e,-.42*r+e,e,e);
  // sourire
  g.strokeStyle='#0b0b0b'; g.lineWidth=Math.max(1.8,r*.15);
  g.beginPath(); g.arc(0,.04*r,r*.56,.34,Math.PI-.34); g.stroke();
  g.restore();
}

    v:160+Math.random()*250,r:12+Math.random()*18,a:Math.random()*7,s:(Math.random()-.5)*4.5});
  raining=true; }
function stopRain(){ raining=false; fx.clearRect(0,0,W,H); }
function hud(){
  ctx.fillStyle='rgba(0,0,0,.78)'; ctx.fillRect(0,0,W,52);
  txt(t('respect'),14,18,11,'#7c8b8c','left','i'); txt(G.resp,14,36,22,TQ,'left');
  txt(t('cash'),112,18,11,'#7c8b8c','left','i'); txt(G.cash+' €',112,36,22,'#fff','left');
  txt(G.dj,W-62,30,20,'rgba(255,255,255,.5)','right');
}

/* ---------- panneaux ---------- */
const panels={menu:'p-menu',brief:'p-brief',choice:'p-choice',result:'p-result',end:'p-end'};
function show(id){for(const k in panels)document.getElementById(panels[k]).classList.add('hidden');
  if(id)document.getElementById(panels[id]).classList.remove('hidden');}
const $=id=>document.getElementById(id);

$('b-start').onclick=()=>{aInit(); if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
  const v=$('djname').value.trim(); G.dj=(v||'DJ PIXEL').toUpperCase();
  G.resp=0; G.cash=200; G.mission=0; brief();};
function brief(){
  const m=MIS()[G.mission];
  $('brief-n').textContent=m.n; $('brief-t').innerHTML=m.t; $('brief-d').innerHTML=m.d;
  $('brief-c').textContent=m.c; $('s-resp').textContent=G.resp; $('s-cash').textContent=G.cash;
  G.scene='brief'; A.playing=false; show('brief');
}
$('b-go').onclick=()=>{show(null); stopRain(); A.playing=true; start(G.mission);};
let lastResult={ok:false};
function result(ok,title,desc,dResp,dCash){
  G.resp=Math.max(0,G.resp+dResp); G.cash=Math.max(0,G.cash+(dCash||0));
  lastResult={ok:ok};
  $('res-t').textContent=title; $('res-t').className=ok?'ok':'ko';
  $('res-d').innerHTML=desc;
  $('r-resp').textContent=G.resp; $('r-cash').textContent=G.cash+' €';
  $('b-next').textContent=(G.mission>=3)?t('nextend'):t('next');
  $('b-next').style.display=ok?'':'none';
  $('b-retry').style.display=ok?'none':'';
  G.scene='result'; A.playing=false; show('result');
  if(ok){ startRain(); sWin(); } else { stopRain(); sLose(); }
}
$('b-next').onclick=()=>{ stopRain();
  if(G.mission>=3){ endGame(); } else { G.mission++; brief(); }};
$('b-retry').onclick=()=>{show(null); stopRain(); A.playing=true; start(G.mission);};
$('b-again').onclick=()=>{stopRain();G.resp=0;G.cash=200;G.mission=0;G.scene='menu';A.playing=false;show('menu');};
function endGame(){
  let r,d;
  if(G.resp>=34){r=t('k1');d=t('kd1');}
  else if(G.resp>=24){r=t('k2');d=t('kd2');}
  else if(G.resp>=14){r=t('k3');d=t('kd3');}
  else {r=t('k4');d=t('kd4');}
  $('end-rank').innerHTML=r; $('end-d').innerHTML=d;
  $('e-resp').textContent=G.resp; $('e-cash').textContent=G.cash+' €';
  G.scene='end'; A.playing=false; startRain(); show('end');
}

/* ================= MISSIONS ================= */
let S={}; // état de la mission courante
function start(i){
  G.shake=0; P.down=false; P.tapped=false;
  if(i===0) S={k:0,x:W/2,prog:0,time:46,road:0,cars:[],spawn:0,cop:-1,copGap:260,boost:false,evt:0,hitT:0};
  if(i===1) S={k:1,notes:[],spawn:0,hype:62,time:52,lanes:4,fx:[],drunk:0,ignored:0,next:38,evts:0};
  if(i===2) S={k:2,dist:0,y:0,vy:0,slide:0,obs:[],spawn:1,gap:200,stumble:0,run:0,park:0};
  if(i===3) S={k:3,alt:1200,x:W/2,wind:0,wt:0,tx:W/2,td:1,landed:0,drift:0};
  G.scene='play';
}

/* --- M1 : la tournée --- */
const LANES=[96,192,288,384];
function m1(dt){
  const sp=S.boost?430:340;
  S.road+=sp*dt;
  S.prog+=dt*(100/ (S.boost?22:26));
  S.time-=dt;
  // pilotage
  if(P.down) S.x+=(P.x-S.x)*Math.min(1,dt*9);
  if(keys.ArrowLeft) S.x-=300*dt;
  if(keys.ArrowRight) S.x+=300*dt;
  S.x=Math.max(70,Math.min(W-70,S.x));
  // évènement
  if(!S.boost&&S.prog>42){S.boost=true;S.evt=3;S.cop=S.x;sfx(400,900,.4,'triangle',.2);}
  // spawn trafic
  S.spawn-=dt;
  if(S.spawn<=0){
    S.spawn=S.boost?.52:.72;
    const l=LANES[(Math.random()*4)|0];
    S.cars.push({x:l,y:-80,v:sp*(.35+Math.random()*.2),t:Math.random()<.22?'cone':'car'});
  }
  for(const c of S.cars) c.y+=(sp-c.v)*dt;
  S.cars=S.cars.filter(c=>c.y<H+90);
  // collisions
  S.hitT-=dt;
  if(S.hitT<=0) for(const c of S.cars){
    const w=c.t==='cone'?26:54,h=c.t==='cone'?26:86;
    if(Math.abs(c.x-S.x)<(w/2+26)&&Math.abs(c.y-690)<(h/2+42)){
      S.hitT=.7; G.shake=14; S.copGap-=70; S.time-=1.5; sCrash(); break;}
  }
  // police
  if(S.boost){
    S.cop+=(S.x-S.cop)*Math.min(1,dt*2.2);
    S.copGap=Math.min(300,S.copGap+22*dt);
    if(S.copGap<=0){ result(false,t('fcop'),t('rcop'),-3,-60); return;}
  }
  if(S.prog>=100){
    const bonus=Math.max(0,Math.round(S.time/6));
    result(true,t('win'),t('w1').replace('{r}',5+bonus),5+bonus,150); return;
  }
  if(S.time<=0){ result(false,t('ftime'),t('rtime'),-3,0); return;}
  // ---- rendu ----
  ctx.fillStyle='#0a0d10'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#14181d'; ctx.fillRect(56,0,W-112,H);
  ctx.strokeStyle='rgba(38,239,197,.35)'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(56,0);ctx.lineTo(56,H);ctx.moveTo(W-56,0);ctx.lineTo(W-56,H);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=5; ctx.setLineDash([42,38]);
  ctx.lineDashOffset=-S.road%80;
  for(const lx of [144,240,336]){ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);
  for(const c of S.cars){
    if(c.t==='cone'){ctx.fillStyle='#ff8c42';ctx.beginPath();ctx.moveTo(c.x,c.y-15);
      ctx.lineTo(c.x+13,c.y+13);ctx.lineTo(c.x-13,c.y+13);ctx.fill();}
    else{ctx.fillStyle='#4a5560'; rr(c.x-27,c.y-43,54,86,10); ctx.fill();
      ctx.fillStyle='#2b333b'; rr(c.x-19,c.y-24,38,30,6); ctx.fill();
      ctx.fillStyle='#ffd9a0'; ctx.fillRect(c.x-22,c.y+38,10,5); ctx.fillRect(c.x+12,c.y+38,10,5);}
  }
  if(S.boost){
    const cy=690+S.copGap, fl=(G.t*6|0)%2===0;
    ctx.fillStyle='#1c2430'; rr(S.cop-28,cy-44,56,88,10); ctx.fill();
    glow(fl?'#3b82f6':'#ef4444',18,()=>{ctx.fillStyle=fl?'#3b82f6':'#ef4444';
      ctx.fillRect(S.cop-20,cy-50,40,8);});
  }
  // joueur
  const px=S.x, py=690, blink=S.hitT>0&&((G.t*12|0)%2===0);
  if(!blink){
    glow(TQ,16,()=>{ctx.fillStyle=TQ; rr(px-26,py-42,52,84,10); ctx.fill();});
    ctx.fillStyle='#04221c'; rr(px-19,py-24,38,32,7); ctx.fill();
    drawSmiley(ctx,px,py-8,13,0);
    ctx.fillStyle='#fff'; ctx.globalAlpha=.2;
    ctx.beginPath();ctx.moveTo(px-20,py-42);ctx.lineTo(px-34,py-150);ctx.lineTo(px-6,py-42);ctx.fill();
    ctx.beginPath();ctx.moveTo(px+20,py-42);ctx.lineTo(px+34,py-150);ctx.lineTo(px+6,py-42);ctx.fill();
    ctx.globalAlpha=1;
  }
  hud();
  bar(14,62,W-28,10,S.prog/100,TQ);
  txt(t('ab')+'  '+Math.floor(S.prog)+'%',W/2,88,18,'#9fb0b1');
  txt(Math.max(0,S.time).toFixed(1)+' s',W-16,88,20,S.time<10?'#ff4d6d':'#fff','right');
  if(S.evt>0){S.evt-=dt;
    ctx.fillStyle='rgba(255,77,109,.9)'; ctx.fillRect(0,H/2-46,W,92);
    txt(t('evt1'),W/2,H/2-14,32,'#fff');
    txt(t('evt2'),W/2,H/2+20,15,'rgba(255,255,255,.85)','center','i');}
  if(S.boost&&S.copGap<110) txt(t('cops'),W/2,H-30,22,'#ff4d6d');
}

/* --- M2 : le dancefloor --- */
function m2(dt){
  S.time-=dt;
  S.hype-=1.8*dt;
  S.spawn-=dt;
  if(S.spawn<=0){
    S.spawn=.34+Math.random()*.16;
    const l=(Math.random()*4)|0;
    S.notes.push({l:l,y:-30});
    if(Math.random()<.18){let l2=(l+1+((Math.random()*3)|0))%4; S.notes.push({l:l2,y:-30});}
  }
  const JY=716;
  for(const n of S.notes) n.y+=430*dt;
  for(const n of S.notes) if(!n.hit&&n.y>JY+46){n.hit='late'; S.hype-=5; sMiss(); G.shake=5;}
  S.notes=S.notes.filter(n=>n.y<H+40);
  // taps
  const lanesX=[60,165,270,375], lw=105;
  function judge(l){
    let best=null,bd=1e9;
    for(const n of S.notes){ if(n.hit||n.l!==l)continue; const d=Math.abs(n.y-JY);
      if(d<bd){bd=d;best=n;} }
    if(best&&bd<62){best.hit='ok'; S.hype=Math.min(100,S.hype+4.2); sHit();
      S.fx.push({x:lanesX[l]+lw/2,y:JY,t:0});}
    else { S.hype-=2.6; sMiss(); }
  }
  if(P.tapped){ const l=Math.max(0,Math.min(3,Math.floor(P.tapX/120))); judge(l); }
  ['a','z','e','r'].forEach((k,i)=>{ if(keys[k]){keys[k]=false; judge(i);} });
  for(const f of S.fx) f.t+=dt; S.fx=S.fx.filter(f=>f.t<.35);
  S.hype=Math.min(100,S.hype);
  if(S.hype<=0){ result(false,t('fdead'),t('rdead'),-3,0); return;}
  // évènement mec bourré
  if(S.time>3&&S.time<=S.next&&S.drunk===0){ S.drunk=1; drunkEvent(); return; }
  if(S.time<=0){
    const b=S.hype>80?4:S.hype>55?2:0;
    result(true,t('wset'),t('rset').replace('{r}',5+b),5+b,120); return;}
  // ---- rendu ----
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#13081d'); g.addColorStop(1,'#07090b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // lasers
  const pulse=.5+.5*Math.sin(G.t*8);
  ctx.globalAlpha=.16+.12*pulse; ctx.fillStyle=TQ;
  for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W/2,70);
    ctx.lineTo(i*120-60+Math.sin(G.t*1.6+i)*60,520);ctx.lineTo(i*120+40+Math.sin(G.t*1.6+i)*60,520);ctx.fill();}
  ctx.globalAlpha=1;
  // foule
  ctx.fillStyle='rgba(0,0,0,.65)';
  for(let i=0;i<16;i++){ const x=14+i*30, bob=Math.sin(G.t*6+i)*7;
    ctx.beginPath(); ctx.arc(x,470+bob,12,0,7); ctx.fill();
    ctx.fillRect(x-11,480+bob,22,70);}
  // colonnes
  for(let i=0;i<4;i++){
    ctx.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(255,255,255,.015)';
    ctx.fillRect(i*120,560,120,H-560);
  }
  ctx.strokeStyle='rgba(38,239,197,.75)'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,JY);ctx.lineTo(W,JY);ctx.stroke();
  for(const n of S.notes){ if(n.hit||n.y<118)continue;
    glow(TQ,10,()=>{ctx.fillStyle=TQ; rr(n.l*120+16,n.y-13,88,26,8); ctx.fill();}); }
  for(const f of S.fx){ ctx.strokeStyle='rgba(38,239,197,'+(1-f.t/.35)+')'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(f.x,f.y,10+f.t*110,0,7); ctx.stroke(); }
  // platines
  ctx.fillStyle='#0f1316'; ctx.fillRect(0,760,W,94);
  for(const cx of [92,388]){ ctx.fillStyle='#1b2227'; ctx.beginPath(); ctx.arc(cx,812,38,0,7); ctx.fill();
    ctx.strokeStyle='rgba(38,239,197,.6)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(cx,812,38,G.t*5,G.t*5+2.2); ctx.stroke();
    ctx.fillStyle=TQ; ctx.beginPath(); ctx.arc(cx,812,6,0,7); ctx.fill(); }
  const bob=Math.sin(G.t*6.3)*4;
  ctx.fillStyle='#161d22'; rr(W/2-44,812+bob,88,46,14); ctx.fill();
  drawSmiley(ctx,W/2,790+bob,29,Math.sin(G.t*3.1)*.09);
  txt(t('pads'),W/2,744,14,'rgba(255,255,255,.3)');
  hud();
  txt(t('hype'),14,62,13,'#7c8b8c','left','i');
  bar(62,58,W-78,12,S.hype/100,S.hype>35?TQ:'#ff4d6d');
  bar(14,84,W-28,6,1-S.time/52,'rgba(255,255,255,.4)');
  txt(t('sets')+'  '+Math.max(0,S.time|0)+'s',W/2,106,16,'#9fb0b1');
}
function drunkEvent(){
  A.playing=false; G.scene='choice';
  const list=$('ch-list'); list.innerHTML='';
  const opts=[
    {t:t('o1t'),s:t('o1s'),f:()=>{
      S.ignored++;
      if(S.ignored>=3){ result(false,t('fban'),t('rban'),-4,0); return true;}
      S.hype=Math.min(100,S.hype+3); G.resp+=1; return false;}},
    {t:t('o2t'),s:t('o2s'),f:()=>{
      G.cash=Math.max(0,G.cash-5); G.resp+=2; S.hype=Math.min(100,S.hype+8); S.ignored=0; return false;}},
    {t:t('o3t'),s:t('o3s'),f:()=>{
      S.hype=Math.max(1,S.hype-16); G.resp=Math.max(0,G.resp-2); S.ignored=0; return false;}}
  ];
  const labels=[t('d1'),t('d2'),t('d3')];
  $('ch-t').textContent=labels[Math.min(2,S.evts)]; S.evts++;
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=o.t+'<small>'+o.s+'</small>';
    b.onclick=()=>{ show(null); const over=o.f();
      if(over) return;
      S.drunk=0; S.next=(S.evts>=3)?-1:S.time-13; A.playing=true; G.scene='play'; P.tapped=false; };
    list.appendChild(b);
  });
  show('choice');
}

/* --- M3 : la fuite --- */
function m3(dt){
  const sp=240+S.dist*1.1;
  S.dist+=dt*(100/16);
  S.run+=dt;
  // saut / glisse
  const jump=(P.tapped&&P.tapX>W/2)||keys.ArrowUp||keys[' '];
  const slide=(P.tapped&&P.tapX<=W/2)||keys.ArrowDown;
  if(jump&&S.y===0&&S.slide<=0){S.vy=-620; sfx(300,620,.12,'triangle',.16);}
  if(slide&&S.y===0&&S.slide<=0){S.slide=.55; sfx(500,160,.16,'sawtooth',.14);}
  if(S.slide>0)S.slide-=dt;
  S.vy+=1900*dt; S.y+=S.vy*dt;
  if(S.y>0){S.y=0;S.vy=0;}
  // obstacles
  S.spawn-=dt;
  if(S.spawn<=0){ S.spawn=.95+Math.random()*.65;
    S.obs.push({x:W+60,t:Math.random()<.45?'low':'high'}); }
  for(const o of S.obs) o.x-=sp*dt;
  S.obs=S.obs.filter(o=>o.x>-90);
  const PX=140, GY=640;
  S.stumble-=dt;
  if(S.stumble<=0) for(const o of S.obs){
    if(Math.abs(o.x-PX)<34){
      const h=S.y, sl=S.slide>0;
      const safe = o.t==='high' ? (h<-60) : sl;
      if(!safe){ S.stumble=.6; S.gap-=72; G.shake=12; sCrash(); }
    }
  }
  S.gap=Math.min(230,S.gap+13*dt);
  if(S.gap<=0){ result(false,t('fcau'),t('rcau'),-3,-120); return;}
  if(S.dist>=100){ result(true,t('wesc'),t('resc'),6,-80); return;}
  // ---- rendu ----
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b1220'); g.addColorStop(1,'#07090b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // immeubles parallaxe
  ctx.fillStyle='#10161d';
  for(let i=0;i<8;i++){ const bx=((i*130-S.dist*7)%(W+260))-130;
    ctx.fillRect(bx,300+((i*53)%90),110,360); }
  ctx.fillStyle='rgba(38,239,197,.35)';
  for(let i=0;i<30;i++){ const bx=((i*47-S.dist*7)%(W+260))-130;
    ctx.fillRect(bx+12,330+((i*71)%260),9,12); }
  // sol
  ctx.fillStyle='#161b20'; ctx.fillRect(0,GY,W,H-GY);
  ctx.strokeStyle='rgba(38,239,197,.4)'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=4; ctx.setLineDash([30,30]);
  ctx.lineDashOffset=S.dist*14; ctx.beginPath();ctx.moveTo(0,GY+58);ctx.lineTo(W,GY+58);ctx.stroke();
  ctx.setLineDash([]);
  // obstacles
  for(const o of S.obs){
    if(o.t==='high'){ ctx.fillStyle='#8a5a3b'; rr(o.x-22,GY-54,44,54,6); ctx.fill();
      ctx.fillStyle='#6b452c'; ctx.fillRect(o.x-22,GY-54,44,9); }
    else { ctx.fillStyle='#ff4d6d'; rr(o.x-26,GY-150,52,16,6); ctx.fill();
      ctx.fillStyle='rgba(255,77,109,.3)'; ctx.fillRect(o.x-3,GY-134,6,134); }
  }
  // videur
  const gx=Math.max(16,PX-S.gap);
  ctx.fillStyle='#1d242b'; ctx.fillRect(gx-16,GY-96,32,96);
  ctx.beginPath(); ctx.arc(gx,GY-108,15,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.fillRect(gx-17,GY-120,34,8);
  // joueur
  const py=GY+S.y, sl=S.slide>0;
  glow(TQ,14,()=>{ ctx.fillStyle=TQ;
    if(sl){ rr(PX-30,py-28,56,28,8); ctx.fill(); }
    else { rr(PX-15,py-76,30,76,8); ctx.fill(); }});
  if(sl) drawSmiley(ctx,PX+16,py-30,15,-.9); else drawSmiley(ctx,PX,py-92,17,Math.sin(S.run*16)*.07);
  if(!sl){ ctx.strokeStyle=TQ; ctx.lineWidth=7; const sw=Math.sin(S.run*16)*16;
    ctx.beginPath(); ctx.moveTo(PX,py-4); ctx.lineTo(PX+sw,py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PX,py-4); ctx.lineTo(PX-sw,py); ctx.stroke(); }
  ctx.fillStyle='#0f1316'; rr(PX-34,py-(sl?26:62),22,22,4); ctx.fill();
  txt('♪',PX-23,py-(sl?15:51),16,TQ);
  // camionnette à l'arrivée
  if(S.dist>88){ const vx=W-60+(100-S.dist)*22;
    ctx.fillStyle='#2b3440'; rr(vx-60,GY-96,120,96,8); ctx.fill();
    ctx.fillStyle=TQ; ctx.fillRect(vx-44,GY-80,36,26);
    txt('PIXEL\'S',vx+16,GY-60,18,TQ); }
  hud();
  bar(14,62,W-28,10,S.dist/100,TQ);
  txt(Math.floor(S.dist)+' m / 100 m',W/2,88,18,'#9fb0b1');
  txt(t('slide'),80,H-26,18,'rgba(255,255,255,.4)');
  txt(t('jump'),W-80,H-26,18,'rgba(255,255,255,.4)');
  if(S.gap<80) txt(t('catch'),W/2,140,24,'#ff4d6d');
}

/* --- M4 : parachute mainstage --- */
function m4(dt){
  S.alt-=115*dt;
  S.wt-=dt;
  if(S.wt<=0){ S.wt=1.6+Math.random()*1.2; S.wind=(Math.random()*2-1)*105; }
  S.x+=S.wind*dt;
  if(P.down) S.x+=Math.max(-190,Math.min(190,(P.x-S.x)*4))*dt;
  if(keys.ArrowLeft) S.x-=185*dt;
  if(keys.ArrowRight) S.x+=185*dt;
  S.x=Math.max(20,Math.min(W-20,S.x));
  S.tx=W/2+Math.sin(G.t*.8)*78;
  if(S.alt<=0){
    const d=Math.abs(S.x-S.tx);
    if(d<30){ result(true,t('wper'),t('rper'),9,400); return;}
    if(d<98){ result(true,t('wsta'),t('rsta'),6,300); return;}
    result(false,t('foff'),t('roff'),-3,-50); return;
  }
  // ---- rendu ----
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#071b2a'); g.addColorStop(1,'#0d0820');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(let i=0;i<6;i++){ const cy=((i*180+(1200-S.alt)*2.4)%(H+240))-120;
    ctx.beginPath(); ctx.ellipse((i*97)%W,cy,70,22,0,0,7); ctx.fill(); }
  // sol / festival
  const k=Math.max(0,1-S.alt/1200), groundY=H-60-k*120;
  ctx.fillStyle='#0b1014'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='rgba(255,255,255,.10)';
  for(let i=0;i<70;i++){ const px=(i*37)%W, py=groundY+22+((i*53)%90)*(.3+k*.7);
    ctx.fillRect(px,py,3+k*3,3+k*3); }
  // mainstage
  const tw=52+k*52;
  glow(TQ,24,()=>{ ctx.fillStyle='rgba(38,239,197,.25)';
    ctx.fillRect(S.tx-tw,groundY+8,tw*2,36+k*40); });
  ctx.strokeStyle=TQ; ctx.lineWidth=3;
  ctx.strokeRect(S.tx-tw,groundY+8,tw*2,36+k*40);
  txt('MAINSTAGE',S.tx,groundY+30+k*20,16+k*10,TQ);
  ctx.strokeStyle='rgba(38,239,197,.5)'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(S.tx,groundY+8);ctx.lineTo(S.tx,0);ctx.stroke();
  // parachutiste
  const py=288+(1-S.alt/1200)*150;
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
  for(const o of [-34,-12,12,34]){ ctx.beginPath(); ctx.moveTo(S.x,py); ctx.lineTo(S.x+o,py-46); ctx.stroke(); }
  glow(TQ,16,()=>{ ctx.fillStyle=TQ; ctx.beginPath();
    ctx.ellipse(S.x,py-48,48,26,0,Math.PI,0); ctx.fill(); });
  ctx.fillStyle='#fff'; rr(S.x-7,py+8,14,22,5); ctx.fill();
  drawSmiley(ctx,S.x,py+4,13,Math.sin(G.t*2)*.12);
  hud();
  txt(t('alt'),14,62,13,'#7c8b8c','left','i');
  txt(Math.max(0,S.alt|0)+' m',W-16,64,22,'#fff','right');
  bar(14,82,W-28,8,S.alt/1200,TQ);
  if(Math.abs(S.wind)>30){
    txt((S.wind>0?t('windr'):t('windl')),W/2,122,26,'#ff8c42');
  }
  const dx=S.x-S.tx;
  txt(Math.abs(dx|0)+' '+(dx>0?t('offr'):t('offl')),W/2,152,16,'#9fb0b1');
}

/* ---------- boucle ---------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  ctx.save();
  if(G.shake>0){ G.shake-=dt*45;
    ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake); }
  if(G.scene==='play'){
    if(S.k===0) m1(dt); else if(S.k===1) m2(dt); else if(S.k===2) m3(dt); else m4(dt);
  } else {
    // fond animé pour les écrans
    ctx.fillStyle='#07090b'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.25;
    for(let i=0;i<40;i++){ const y=(i*37+G.t*22)%H;
      ctx.fillStyle=i%3?'rgba(38,239,197,.10)':'rgba(255,255,255,.05)';
      ctx.fillRect(0,y,W,2); }
    ctx.globalAlpha=1;
    for(let i=0;i<22;i++){ const x=(i*29+G.t*14)%W, h=40+Math.abs(Math.sin(i+G.t*2))*140;
      ctx.fillStyle='rgba(38,239,197,.10)'; ctx.fillRect(x,H-h,12,h); }
  }
  ctx.restore();
  if(raining){ fx.clearRect(0,0,W,H);
    for(const p of rain){ p.y+=p.v*dt; p.a+=p.s*dt;
      if(p.y>H+70){ p.y=-70; p.x=Math.random()*W; }
      if(p.y>-70) drawSmiley(fx,p.x,p.y,p.r,p.a); } }
  P.tapped=false;
  requestAnimationFrame(loop);
}
document.querySelectorAll('#langs button').forEach(b=>{
  b.onclick=()=>{ lang=b.dataset.l; applyLang(); }; });
applyLang();
try{ const lg=document.getElementById('logo').getContext('2d');
  lg.scale(2,2); drawSmiley(lg,60,62,48,0); }catch(e){}
show('menu');
requestAnimationFrame(loop);
</script>
